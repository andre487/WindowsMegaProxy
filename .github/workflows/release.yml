name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      UV_PYTHON: '3.13'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\.tools\python
      UV_CACHE_DIR: ${{ github.workspace }}\.tools\uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and committed notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected vX.Y.Z' }
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup[0].Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and application version differ' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw 'Release commit must belong to main' }
          if (!(Test-Path "release-notes/$env:RELEASE_TAG.md")) { throw 'Committed release notes are missing' }

      - name: Require successful main CI for the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = git rev-parse HEAD
          $success = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&event=push&branch=main&per_page=10" | ConvertFrom-Json
            if ($LASTEXITCODE) { throw 'Cannot query CI status' }
            $run = $response.workflow_runs | Select-Object -First 1
            if ($run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') { throw 'Main CI did not pass' }
              $success = $true
              break
            }
            Start-Sleep -Seconds 30
          }
          if (!$success) { throw 'Timed out waiting for main CI' }

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download build dependencies
        shell: cmd
        run: setup.cmd

      - name: Build signed update packages and native installer
        shell: cmd
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: build-installer.cmd

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packages
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-packages
          path: artifacts/release

      - name: Publish immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >release-state.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' release-state.json >/dev/null; then
              echo 'Release already exists; refusing to replace published update assets.' >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          rm -f release-state.json
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "../../release-notes/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
