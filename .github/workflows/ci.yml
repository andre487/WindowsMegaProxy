name: CI
run-name: CI · ${{ github.event.pull_request.title || github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_plan.py

  code:
    needs: plan
    if: needs.plan.outputs.mode == 'ui' || needs.plan.outputs.mode == 'full'
    name: Code and UI checks
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    env:
      UV_PYTHON: '3.13'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\.tools\python
      UV_CACHE_DIR: ${{ github.workspace }}\.tools\uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download development dependencies
        run: setup.cmd

      - name: Test Python tools
        run: tools-test.cmd

      - name: Test configuration, diagnostics and TraceProbe
        run: test.cmd

      - name: Test Windows interface
        run: ui-test.cmd

      - name: Test DEV identity, resources and isolation
        run: scripts\dotnet.cmd run --project tests\WindowsMegaProxy.UiChecks -c Release -p:MegaProxyDev=true

      - name: Upload test reports and interface screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-code-results
          path: |
            artifacts/**/result.txt
            artifacts/**/failure.txt
            artifacts/ui-checks/*.png
            artifacts/ui-checks-dev/*.png
            artifacts/installer-checks/*.log
          if-no-files-found: warn
          retention-days: 7

  network:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: HTTP3 and SSH checks
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    env:
      UV_PYTHON: '3.13'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\.tools\python
      UV_CACHE_DIR: ${{ github.workspace }}\.tools\uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download development dependencies
        run: setup.cmd

      - name: Test HTTP/3 and HTTPS Jump on local servers
        run: h3-test.cmd

      - name: Test SSH on a local server
        run: ssh-test.cmd

      - name: Test IPv6 routing across all proxy types on local servers
        run: ipv6-test.cmd

      - name: Test selective domain sniffing on local servers
        run: scripts\tools.cmd scripts\sniff_test.py

      - name: Upload test reports and interface screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-network-results
          path: |
            artifacts/**/result.txt
            artifacts/**/failure.txt
            artifacts/ui-checks/*.png
            artifacts/ui-checks-dev/*.png
            artifacts/installer-checks/*.log
          if-no-files-found: warn
          retention-days: 7

  installer-package:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Build installer test package
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    env:
      UV_PYTHON: '3.13'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\.tools\python
      UV_CACHE_DIR: ${{ github.workspace }}\.tools\uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download development dependencies
        run: setup.cmd

      - name: Publish self-contained application folders
        run: build.cmd

      - name: Compile preview installer and verify update packages
        run: build-installer.cmd --preview --skip-build

      - name: Verify checksums with the release publishing tool
        shell: bash
        working-directory: artifacts/release-preview
        run: sha256sum --check SHA256SUMS

      - name: Upload preview installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-preview
          path: artifacts/release-preview/*
          retention-days: 7

      - name: Upload installer smoke inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-smoke-inputs
          path: |
            artifacts/release-preview/*-setup.exe
            artifacts/release-preview/update-manifest.json
          compression-level: 0
          retention-days: 7

      - name: Upload packaging test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-package-results
          path: artifacts/installer-checks/**
          if-no-files-found: warn
          retention-days: 7

  installer-smoke:
    needs: [plan, installer-package]
    if: needs.plan.outputs.mode == 'full'
    name: Installer smoke (${{ matrix.suite }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [installation, updates, dev]
    defaults:
      run:
        shell: cmd
    env:
      UV_PYTHON: '3.13'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\.tools\python
      UV_CACHE_DIR: ${{ github.workspace }}\.tools\uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download development dependencies
        run: setup.cmd

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installer-smoke-inputs
          path: artifacts/release-preview

      - name: Build installed settings fixtures
        if: matrix.suite != 'dev'
        run: scripts\dotnet.cmd build tests\WindowsMegaProxy.UiChecks -c Release

      - name: Build DEV settings and channel fixtures
        if: matrix.suite == 'dev'
        run: scripts\dotnet.cmd build tests\WindowsMegaProxy.UiChecks -c Release -p:MegaProxyDev=true

      - name: Test installer or deferred updates
        if: matrix.suite != 'dev'
        run: scripts\tools.cmd scripts\installer_smoke.py --suite ${{ matrix.suite }}

      - name: Test all DEV modes and complete startup cleanup
        if: matrix.suite == 'dev'
        run: scripts\tools.cmd scripts\dev_mode_smoke.py

      - name: Upload smoke test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-${{ matrix.suite }}-results
          path: |
            artifacts/**/result.txt
            artifacts/**/failure.txt
            artifacts/installer-checks/*.log
          if-no-files-found: warn
          retention-days: 7

  installer:
    needs: [plan, installer-package, installer-smoke]
    if: always() && needs.plan.outputs.mode == 'full'
    name: Installer and DEV mode checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require packaging and every smoke suite
        env:
          PACKAGE_RESULT: ${{ needs.installer-package.result }}
          SMOKE_RESULT: ${{ needs.installer-smoke.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$SMOKE_RESULT" = success

  windows-tests:
    needs: [plan, code, network, installer]
    if: always()
    name: Windows tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify all selected jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py --verify

      - name: "Release CI identity: PR ${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }} base ${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'
        run: echo Checking the recorded pull request revision and base.

      - name: "Verified tree: ${{ needs.plan.outputs.tree }}"
        run: echo All selected checks passed for this tree.
