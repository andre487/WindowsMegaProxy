name: Published update check
run-name: Verify automatic update from 0.0.8 to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published target version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: cmd
    env:
      UV_PYTHON: '3.13'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\.tools\python
      UV_CACHE_DIR: ${{ github.workspace }}\.tools\uv-cache
      UPDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download development dependencies
        run: setup.cmd

      - name: Update the installed published client through its UI without starting TUN
        run: scripts\tools.cmd scripts\update_smoke.py

      - name: Upload update diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-update-results
          path: artifacts/update-checks/**
          if-no-files-found: warn
          retention-days: 7
